<title>Doctor's Desk Option 4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout follows the MRS reference: teal app bar, doctor bar, one patient band, then Today's visit in three columns
   (templates + note on the left, the sorted record in the middle, past records on the right) and a footer with follow-up and Finish. */
:root {
  --bg: #EFEFEF;
  --panel: #FFFFFF;
  --panel-2: #F3F3F3;
  --chip: #EEEEEE;
  --line: #DCDCDC;
  --line-2: #E8E8E8;
  --ink: #111111;
  --ink-2: #4A4A4A;
  --ink-3: #8A8A8A;
  --brand: #009688;
  --brand-ink: #FFFFFF;
  --brand-2: #00796B;
  --link: #1565C0;
  --avatar-bg: #FFE9B5; --avatar-ink: #E08A00;

  --sym: #9C27B0; --sym-bg: #F5E3F8;
  --dx: #E08A00;  --dx-bg: #FCEFD6;
  --rx: #1E88E5;  --rx-bg: #E1EEFC;
  --inv: #00897B; --inv-bg: #D9F0EC;
  --adv: #5D6B2A; --adv-bg: #E9EDD8;
  --none: #757575; --none-bg: #ECECEC;

  --crit: #C62828; --crit-bg: #FDE7E7;
  --warn: #A86400; --warn-bg: #FBEFD5;
  --ok: #2E7D32;

  --f-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121615; --panel: #1B2120; --panel-2: #222927; --chip: #2A3230; --line: #34403D; --line-2: #2B3533;
    --ink: #ECF1F0; --ink-2: #B4C0BD; --ink-3: #82908D;
    --brand: #0E8A7E; --brand-ink: #FFFFFF; --brand-2: #4DB6AC; --link: #7FB3F5;
    --avatar-bg: #4A3A12; --avatar-ink: #FFC757;
    --sym: #D68AE6; --sym-bg: #3A2340; --dx: #F2B24C; --dx-bg: #3D2E14;
    --rx: #7DB7F5; --rx-bg: #1B2E47; --inv: #4DC2B4; --inv-bg: #14332F;
    --adv: #B9C783; --adv-bg: #2C3320; --none: #9AA5A3; --none-bg: #2A3230;
    --crit: #F28B82; --crit-bg: #42201E; --warn: #F0BE5A; --warn-bg: #3D3015; --ok: #81C995;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121615; --panel: #1B2120; --panel-2: #222927; --chip: #2A3230; --line: #34403D; --line-2: #2B3533;
  --ink: #ECF1F0; --ink-2: #B4C0BD; --ink-3: #82908D;
  --brand: #0E8A7E; --brand-ink: #FFFFFF; --brand-2: #4DB6AC; --link: #7FB3F5;
  --avatar-bg: #4A3A12; --avatar-ink: #FFC757;
  --sym: #D68AE6; --sym-bg: #3A2340; --dx: #F2B24C; --dx-bg: #3D2E14;
  --rx: #7DB7F5; --rx-bg: #1B2E47; --inv: #4DC2B4; --inv-bg: #14332F;
  --adv: #B9C783; --adv-bg: #2C3320; --none: #9AA5A3; --none-bg: #2A3230;
  --crit: #F28B82; --crit-bg: #42201E; --warn: #F0BE5A; --warn-bg: #3D3015; --ok: #81C995;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; font-feature-settings: "cv11", "ss01"; }
textarea, select, input { font-feature-settings: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.app { height: max(100%, 820px); display: grid; grid-template-rows: auto auto auto auto minmax(0, 1fr) auto; }

/* ---------- app bar ---------- */
.appbar { background: var(--brand); color: var(--brand-ink); display: flex; align-items: center; gap: 18px; min-height: 46px; }
.appbar .ico { width: 22px; height: 22px; flex: none; }
.appbar-brand { display: flex; align-items: center; gap: 12px; font-size: 19px; white-space: nowrap; }
.appbar-brand .sep { width: 1px; height: 22px; background: currentColor; opacity: 0.7; }
.appbar-right { margin-left: auto; display: flex; align-items: center; gap: 18px; }
.search { display: flex; align-items: center; gap: 6px; background: #fff; color: #888; border-radius: 6px; padding: 5px 10px; width: 210px; }
.search input { border: 0; outline: 0; font: inherit; font-size: 13px; width: 100%; background: transparent; color: #222; }
.search svg { width: 14px; height: 14px; flex: none; }
.appbar-link { font-weight: 600; font-size: 14px; white-space: nowrap; }
.appbar .vsep { width: 1px; height: 26px; background: currentColor; opacity: 0.4; }
.appbar-user { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; text-transform: uppercase; white-space: nowrap; }
.icon-btn { border: 0; background: transparent; color: inherit; padding: 2px; cursor: pointer; display: grid; place-items: center; border-radius: 50%; }

/* ---------- doctor bar ---------- */
.docbar { display: flex; align-items: center; gap: 12px; padding-block: 8px; background: var(--bg); border-bottom: 1px solid var(--line-2); }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--avatar-bg); color: var(--avatar-ink); display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: none; }
.doc-name { font-size: 16px; color: var(--ink-2); font-weight: 500; line-height: 1.2; }
.doc-sub { font-size: 12.5px; color: var(--ink-3); }
.queue { margin-left: 18px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--ink-3); }
.queue b { color: var(--ink); font-size: 15px; font-weight: 600; margin-left: 4px; }
.queue .next b { font-size: 13px; }
.queue .qsep { width: 1px; height: 22px; background: var(--line); }
/* patients already seen today, reopened to amend their saved visit */
.seen-wrap { position: relative; margin-left: auto; }
.seen-btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); border-radius: 16px; padding: 5px 12px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.seen-btn:hover, .seen-btn[aria-expanded="true"] { border-color: var(--brand); color: var(--brand-2); }
.seen-btn:disabled { opacity: 0.55; cursor: default; border-color: var(--line); color: var(--ink-3); }
.seen-btn .n { background: var(--brand); color: var(--brand-ink); border-radius: 9px; font-size: 11px; font-weight: 700; min-width: 18px; line-height: 18px; text-align: center; padding: 0 5px; }
.seen-list { position: absolute; top: calc(100% + 4px); right: 0; z-index: 60; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 10px 24px rgba(0,0,0,0.18); padding: 4px; display: grid; min-width: 320px; }
.seen-list .mh { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); padding: 5px 8px; font-weight: 700; }
.seen-list .none { padding: 6px 8px 8px; font-size: 12.5px; color: var(--ink-3); }
.qgroup { display: inline-flex; align-items: center; gap: 14px; }
.mark-present { border: 1px solid var(--brand); background: var(--panel); color: var(--brand-2); border-radius: 16px; padding: 4px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.mark-present:hover { background: var(--brand); color: var(--brand-ink); }
.present-pill { background: color-mix(in srgb, var(--brand) 14%, var(--panel)); color: var(--brand-2); border-radius: 16px; padding: 4px 12px; font-size: 12.5px; font-weight: 600; display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.mark-present svg, .present-pill svg { width: 12px; height: 12px; }
.seen-list button { border: 0; background: transparent; text-align: left; padding: 7px 8px; border-radius: 3px; cursor: pointer; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; font-size: 13.5px; }
.seen-list button:hover, .seen-list button:focus-visible { background: var(--panel-2); }
.seen-list .ph { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; grid-row: span 2; }
.seen-list .ph img, .seen-list .ph svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.seen-list small { color: var(--ink-3); font-size: 12px; grid-column: 2; }
.seen-list .t { grid-column: 3; grid-row: 1 / 3; font-size: 12px; color: var(--ink-3); font-family: var(--f-mono); }
.edit-banner { margin-left: auto; display: flex; align-items: center; gap: 10px; background: var(--warn-bg); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius: 4px; padding: 5px 6px 5px 12px; font-size: 13px; }
.edit-banner svg { width: 15px; height: 15px; color: var(--warn); flex: none; }
.edit-banner button { border: 1px solid var(--line); background: var(--panel); border-radius: 3px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
.edit-banner button:hover { border-color: var(--ink-3); }

/* ---------- patient band ---------- */
/* The patient band stays pinned to the top whenever the page scrolls. */
.band { display: grid; grid-template-columns: auto minmax(232px, 0.95fr) minmax(0, 2.6fr) minmax(0, 1.25fr) minmax(0, 1.35fr); align-items: stretch; gap: 0; padding-block: 8px; position: sticky; top: 0; z-index: 20; background: var(--bg); }
.band.stuck { box-shadow: 0 6px 12px -8px rgba(0,0,0,0.3); }
.photo { width: 128px; height: 128px; border-radius: 50%; overflow: hidden; background: var(--panel); align-self: start; margin-right: 6px; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.06); }
.band > .cell { background: var(--panel); padding: 12px 18px; min-width: 0; }
.band > .cell + .cell { border-left: 1px solid var(--line); background-clip: padding-box; }
.band > .who { border-radius: 4px 0 0 4px; padding-left: 18px; }
.band > .cell:last-child { border-radius: 0 4px 4px 0; }
.who h1 { margin: 0 0 6px; font-size: 21px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.005em; line-height: 1.2; }
.who p { margin: 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.75; }
.who .blood { color: var(--ink); font-weight: 700; }
.band > .cell { position: relative; }
.cell-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 10px; }
.cell-head h2 { margin: 0; font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.01em; }
.cell-head .when { font-size: 12.5px; color: var(--ink-2); }
.cell-head .outline-btn { margin-left: auto; }
.vitals { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.vital { border: 1px solid var(--line); border-radius: 4px; padding: 6px 7px 4px; min-width: 0; background: var(--panel); text-align: left; display: block; width: 100%; cursor: default; }
.vital:disabled { color: inherit; opacity: 1; }
.vital.has-hist { cursor: pointer; }
.vital.has-hist:hover { border-color: var(--ink-3); }
.vital[aria-expanded="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
.vital .k { display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; color: var(--ink); white-space: nowrap; overflow: hidden; }
.vital .k svg { width: 17px; height: 17px; flex: none; color: var(--ink-3); }
.vital .v { margin-top: 4px; font-size: 16px; font-weight: 500; line-height: 1.25; font-variant-numeric: tabular-nums; }
.vital .v small { font-size: 10px; white-space: nowrap; display: inline-block; color: var(--ink-2); margin-left: 3px; font-weight: 400; }
.vital.high .v, .vital.low .v { color: var(--crit); }
.vital.border .v { color: var(--warn); }
.vital .spark { display: block; width: 100%; height: 16px; margin-top: 2px; }
.vital .spark.none { height: 16px; }
.vpop { position: fixed; z-index: 40; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 12px 28px rgba(0,0,0,0.18); padding: 12px 14px 10px; width: 312px; }
.vpop h4 { margin: 0; font-size: 13px; font-weight: 600; text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px; }
.vpop .sub { font-size: 11.5px; color: var(--ink-3); }
.vpop svg { display: block; margin-top: 6px; overflow: visible; }
.vpop .key { display: flex; gap: 12px; font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.vpop .key i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--ink-2); vertical-align: middle; margin-right: 4px; }
.vpop .key i.dash { border-top-style: dashed; }
.vpop .key i.band { height: 8px; border: 0; background: var(--inv-bg); }

.conds { display: flex; flex-wrap: wrap; gap: 8px; }
.cond { background: var(--chip); color: var(--ink-2); font-size: 12px; font-weight: 600; text-transform: uppercase; padding: 5px 10px; border-radius: 14px; letter-spacing: 0.01em; }
.cond.allergy { background: var(--crit-bg); color: var(--crit); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--crit) 45%, transparent); display: inline-flex; gap: 5px; align-items: center; }
.cond.allergy svg { width: 13px; height: 13px; flex: none; }
.cond.nka { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-3); font-weight: 500; }
.more-btn { border: 0; background: transparent; color: var(--link); font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 6px 2px; white-space: nowrap; }
.more-btn:hover { text-decoration: underline; }
.medlist .more-btn { padding: 0; justify-self: start; }
/* Expanded conditions or medicines open over the page below, so the pinned band never grows. */
.expand-pop { position: absolute; top: -1px; left: -1px; z-index: 30; width: max(calc(100% + 2px), 380px); max-height: min(70vh, 540px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 14px 32px rgba(0,0,0,0.2); padding: 12px 18px 14px; }
.meds-cell .expand-pop { left: auto; right: -1px; }
.expand-pop .cell-head .more-btn { margin-left: auto; }
.xlist { list-style: none; margin: 0; padding: 0; display: grid; }
.xlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 7px 0; border-top: 1px solid var(--line-2); font-size: 13.5px; }
.xlist li:first-child { border-top: 0; }
.xlist small { color: var(--ink-3); font-size: 12px; }
.xlist .freq { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.xlist .note { grid-column: 1 / -1; font-size: 12px; color: var(--warn); }
.xlist.allergies li { color: var(--crit); font-weight: 600; }
.xlist.allergies small { color: var(--crit); font-weight: 400; opacity: 0.85; }
.xsub { font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin: 10px 0 2px; }
.xsub:first-of-type { margin-top: 0; }
.medlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.medlist li { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding-left: 4px; }
.medlist .freq { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.medlist .note { display: block; font-size: 11.5px; color: var(--warn); }
.outline-btn { border: 1px solid var(--link); color: var(--link); background: var(--panel); border-radius: 3px; padding: 3px 12px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.outline-btn:hover { background: color-mix(in srgb, var(--link) 8%, var(--panel)); }

/* ---------- today's visit ---------- */
.visit-head { display: flex; align-items: center; min-height: 48px; gap: 12px; padding-block: 12px 10px; }
.visit-head h2 { margin: 0; font-size: 16px; font-weight: 600; text-transform: uppercase; padding-left: 14px; }
.visit-head .recorded { font-size: 12.5px; color: var(--ink-3); }
.work { display: grid; grid-template-columns: minmax(300px, 410px) minmax(0, 1fr) minmax(340px, 500px); gap: 10px; min-height: 0; padding-bottom: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; min-height: 0; min-width: 0; }

.compose { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.tpl-bar { padding: 14px 10px 12px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 8px; align-items: center; }
.tpl-bar label { font-size: 13px; }
.tpl-bar select { font: inherit; font-size: 12.5px; padding: 4px 6px; border-radius: 2px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); justify-self: start; }
.tpls { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; }
.tpl { border: 1px dashed var(--line); background: transparent; border-radius: 2px; padding: 3px 7px; font-size: 12px; cursor: pointer; display: flex; gap: 6px; align-items: baseline; }
.tpl code { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3); }
.tpl:hover { border-style: solid; border-color: var(--brand); }
.composer { margin: 12px 12px 0; border: 1px solid var(--line); border-radius: 2px; overflow: auto; min-height: 160px; background: var(--panel); }
.composer:focus-within { border-color: var(--brand); }
.composer-inner { position: relative; }
.surface {
  font-family: var(--f-body); font-size: 15px; line-height: 1.7; letter-spacing: 0;
  padding: 14px 16px; margin: 0; border: 0; width: 100%;
  white-space: pre-wrap; overflow-wrap: break-word; word-break: normal; tab-size: 4;
}
.mirror { position: absolute; inset: 0; color: transparent; pointer-events: none; overflow: hidden; }
.mirror mark { color: transparent; border-radius: 3px; }
.mirror .m-sym { background: var(--sym-bg); box-shadow: inset 0 -2px 0 var(--sym); }
.mirror .m-dx  { background: var(--dx-bg);  box-shadow: inset 0 -2px 0 var(--dx); }
.mirror .m-rx  { background: var(--rx-bg);  box-shadow: inset 0 -2px 0 var(--rx); }
.mirror .m-inv { background: var(--inv-bg); box-shadow: inset 0 -2px 0 var(--inv); }
.mirror .m-adv { background: var(--adv-bg); box-shadow: inset 0 -2px 0 var(--adv); }
.mirror .m-none { background: transparent; box-shadow: inset 0 -1.5px 0 var(--none); }
.mirror .m-pfx { background: var(--none-bg); }
textarea.surface { position: relative; display: block; background: transparent; color: var(--ink); resize: none; overflow: hidden; outline: none; caret-color: var(--ink); }
textarea.surface::placeholder { color: var(--ink-3); font-style: italic; font-size: 13px; }
.assist { display: flex; align-items: center; gap: 6px; min-height: 40px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); padding: 6px 12px 10px; }
.sugg { border: 1px solid var(--line); background: var(--panel-2); border-radius: 3px; padding: 2px 8px; cursor: pointer; display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink); }
.sugg:first-of-type { border-color: var(--brand); }
.sugg .cat { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
.sugg kbd { font-family: var(--f-mono); font-size: 10px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.legend .s-sym { background: var(--sym); }
.legend .s-dx { background: var(--dx); }
.legend .s-rx { background: var(--rx); }
.legend .s-inv { background: var(--inv); }
.legend .s-adv { background: var(--adv); }
.hint code { font-family: var(--f-mono); font-size: 11px; background: var(--panel-2); padding: 0 4px; border-radius: 3px; color: var(--ink-2); }

.c-sym { color: var(--sym); } .c-dx { color: var(--dx); } .c-rx { color: var(--rx); } .c-inv { color: var(--inv); } .c-adv { color: var(--adv); } .c-none { color: var(--none); }
.d-sym { background: var(--sym); } .d-dx { background: var(--dx); } .d-rx { background: var(--rx); } .d-inv { background: var(--inv); } .d-adv { background: var(--adv); } .d-none { background: var(--none); }

/* the sorted record: each section wears the same colour as its highlight in the note */
.record { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-auto-rows: minmax(max-content, auto); gap: 10px; min-height: 0; overflow: auto; align-content: stretch; }
.sx { --c: var(--none); --cbg: var(--none-bg); background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 2px; padding: 13px 16px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sx-sym { --c: var(--sym); --cbg: var(--sym-bg); min-height: 120px; }
.sx-dx  { --c: var(--dx);  --cbg: var(--dx-bg);  min-height: 120px; }
.sx-rx  { --c: var(--rx);  --cbg: var(--rx-bg);  min-height: 150px; }
.sx-rx ul { grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); align-items: start; }
.sx-inv { --c: var(--inv); --cbg: var(--inv-bg); min-height: 120px; }
.sx-adv { --c: var(--adv); --cbg: var(--adv-bg); min-height: 120px; }
.sx.wide { grid-column: 1 / -1; }
.sx.sx-none { border-style: dashed; border-top-style: solid; }
.sx h3 { margin: 0; font-size: 14px; font-weight: 700; text-transform: uppercase; display: flex; align-items: center; gap: 8px; color: var(--ink); letter-spacing: 0.01em; }
.sx h3 .count { font-family: var(--f-mono); font-size: 11.5px; font-weight: 600; background: var(--cbg); color: var(--c); border-radius: 9px; padding: 0 7px; line-height: 18px; }
.sx h3 .hint2 { margin-left: auto; font-size: 11px; font-weight: 400; text-transform: none; color: var(--ink-3); letter-spacing: 0; }
.sx ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.sx .empty { color: var(--ink-3); font-size: 12.5px; }
.sx-add { display: flex; gap: 6px; margin-top: auto; padding-top: 2px; }
.sx-add input { flex: 1; min-width: 0; font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px dashed color-mix(in srgb, var(--c) 45%, var(--line)); border-radius: 3px; padding: 5px 9px; }
.sx-add input::placeholder { color: var(--ink-3); }
.sx-add input:hover { border-color: var(--c); }
.sx-add input:focus { outline: none; border-style: solid; border-color: var(--c); background: var(--panel); box-shadow: 0 0 0 1px var(--c); }
.sx-add button { border: 1px solid var(--line); background: var(--panel); color: var(--c); font-size: 12.5px; font-weight: 600; border-radius: 3px; padding: 0 12px; cursor: pointer; opacity: 0; transition: opacity .12s; }
.sx-add:focus-within button, .sx-add button:focus-visible { opacity: 1; }
.sx-add button:hover { border-color: var(--c); }
.it { display: flex; align-items: flex-start; gap: 6px; padding: 6px 6px 6px 9px; border-radius: 3px; background: color-mix(in srgb, var(--cbg) 45%, var(--panel)); border-left: 3px solid var(--c); min-width: 0; }
.it-body { flex: 1; min-width: 0; display: grid; gap: 2px; }
.it-main { font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; overflow-wrap: anywhere; }
.tag { font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 3px; padding: 1px 5px; background: var(--none-bg); color: var(--ink-2); white-space: nowrap; }
.tag.dur { text-transform: none; letter-spacing: 0; font-family: var(--f-mono); font-weight: 400; font-size: 11px; }
.tag.prov { background: var(--warn-bg); color: var(--warn); }
.tag.known { background: var(--dx-bg); color: var(--dx); }
.tag.learned { background: transparent; border: 1px solid var(--line); color: var(--ink-3); }
.tag.date { background: var(--adv-bg); color: var(--adv); text-transform: none; letter-spacing: 0; font-size: 11px; }
.it.neg .it-main { color: var(--ink-3); }
.acts { display: flex; gap: 1px; flex: none; opacity: 0.6; }
.it:hover .acts, .it:focus-within .acts { opacity: 1; }
.act { border: 0; background: transparent; color: var(--ink-2); cursor: pointer; padding: 3px; border-radius: 3px; display: grid; place-items: center; }
.act:hover { color: var(--ink); background: color-mix(in srgb, var(--c) 16%, transparent); }
.act.del:hover { color: var(--crit); background: var(--crit-bg); }
.act[aria-pressed="true"] { color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.act svg { width: 15px; height: 15px; }
.remark { font-size: 13px; color: var(--ink-2); cursor: text; font-style: italic; overflow-wrap: anywhere; }
.remark:hover { color: var(--ink); }
.add-remark { flex: none; align-self: center; border: 1px dashed color-mix(in srgb, var(--c) 55%, var(--line)); background: var(--panel); color: var(--c); font-size: 11.5px; font-weight: 600; border-radius: 10px; padding: 1px 9px; cursor: pointer; white-space: nowrap; }
.add-remark:hover { border-style: solid; background: color-mix(in srgb, var(--cbg) 60%, var(--panel)); }
.add-remark[aria-pressed="true"] { border-style: solid; background: var(--cbg); }
.remark-input { font: inherit; font-size: 12.5px; width: 100%; border: 1px solid var(--line); border-radius: 3px; padding: 4px 7px; background: var(--panel); color: var(--ink); margin-top: 2px; }
.remark-input:focus { outline: none; border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
/* medicine dosage editor */
.med-edit { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 7px 8px; padding: 8px; margin-top: 5px; background: var(--panel); border: 1px solid color-mix(in srgb, var(--rx) 35%, var(--line)); border-radius: 3px; }
.med-edit label { display: grid; gap: 2px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); font-weight: 700; min-width: 0; }
.med-edit input, .med-edit select { font: inherit; font-size: 13px; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 3px 5px; width: 100%; min-width: 0; }
.med-edit input:focus, .med-edit select:focus { outline: none; border-color: var(--rx); }
.med-edit .pair { display: flex; gap: 4px; }
.med-edit .pair input { width: 52px; flex: none; }
.med-edit .wide-f { grid-column: 1 / -1; }
.med-edit .unit { font-size: 12px; color: var(--ink-3); text-transform: none; font-weight: 400; letter-spacing: 0; align-self: center; }
.med-main { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font-size: 14px; }
.med-main .form { color: var(--ink-3); font-size: 12px; }
.med-main .str { font-family: var(--f-mono); font-size: 12.5px; }
.med-main .str.def { color: var(--ink-3); border-bottom: 1px dotted var(--ink-3); }
.med-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.freq-pill { font-family: var(--f-mono); font-weight: 500; font-size: 12px; background: var(--rx-bg); color: var(--rx); border-radius: 3px; padding: 0 6px; }
.meta-txt { font-size: 12px; color: var(--ink-2); }
.missing { font-size: 12px; color: var(--warn); }
.flag { font-size: 12.5px; border-radius: 3px; padding: 3px 7px; display: flex; gap: 6px; align-items: flex-start; }
.flag.crit { background: var(--crit-bg); color: var(--crit); font-weight: 600; }
.flag.warn { background: var(--warn-bg); color: var(--warn); }
.flag.info { color: var(--ink-2); padding: 0; }
.flag svg { width: 14px; height: 14px; flex: none; margin-top: 2px; }
.last { font-size: 12px; color: var(--ink-3); }
.last.recent { color: var(--warn); font-weight: 600; }

/* past records */
.records { display: grid; grid-template-rows: auto auto minmax(0, 1fr); overflow: hidden; }
.since { padding: 18px 20px 4px; }
.since h2 { margin: 0 0 2px; font-size: 16px; font-weight: 600; text-transform: uppercase; }
.since p { margin: 0; font-size: 14px; line-height: 1.4; }
.tabs { display: flex; gap: 6px; padding: 12px 14px 0; overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 8px 12px 6px; font-size: 14px; color: var(--ink); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; display: flex; gap: 6px; align-items: center; text-transform: uppercase; }
.tab[aria-selected="true"] { font-weight: 600; border-bottom-color: var(--brand); }
.tab .n { font-size: 11px; background: var(--chip); color: var(--ink-3); border-radius: 50%; min-width: 18px; height: 18px; display: inline-grid; place-items: center; font-weight: 400; }
.tab .n.alert { background: transparent; color: var(--crit); font-weight: 700; }
.tabpanel { overflow: auto; min-height: 0; padding: 12px 10px 14px; display: grid; gap: 8px; align-content: start; }
.lab { display: grid; grid-template-columns: minmax(0, 1fr) minmax(86px, auto) 34px; gap: 4px 12px; padding: 9px 10px 9px 12px; border: 1px solid var(--line); border-radius: 2px; align-items: center; }
.lab.out { border-color: var(--crit); }
.lab-name { font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.lab-name .ref { font-family: var(--f-mono); font-weight: 400; font-size: 11.5px; color: var(--ink-2); }
.lab-trend { display: flex; align-items: center; gap: 10px; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); grid-column: 1; }
.lab-trend svg { flex: none; }
.lab-val { font-family: var(--f-mono); font-weight: 500; font-size: 17px; white-space: nowrap; grid-column: 2; grid-row: 1; }
.lab-val small { font-size: 11.5px; color: var(--ink-2); font-weight: 400; margin-left: 2px; }
.lab-val.high, .lab-val.low { color: var(--crit); }
.lab-val.border { color: var(--warn); }
.lab-val .arr { font-family: var(--f-body); color: var(--ink-3); margin-left: 6px; font-size: 15px; }
.lab-prev { grid-column: 2; grid-row: 2; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); }
.repeat { grid-column: 3; grid-row: 1 / 3; width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); color: var(--ink-2); display: grid; place-items: center; cursor: pointer; }
.repeat:hover { border-color: var(--brand); color: var(--brand); }
.repeat svg { width: 16px; height: 16px; }
.rec-card { border: 1px solid var(--line); border-radius: 2px; padding: 9px 12px; display: grid; gap: 4px; }
.rec-card h4 { margin: 0; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; font-weight: 600; }
.rec-card h4 span { font-weight: 400; font-size: 11.5px; color: var(--ink-2); font-family: var(--f-mono); }
.rec-card p { margin: 0; font-size: 13px; color: var(--ink-2); }
.rec-card .imp { color: var(--ink); }
.rec-card .dx { font-weight: 600; color: var(--ink); }
.rec-empty { color: var(--ink-3); font-size: 13px; padding: 8px 2px; }
.rec-card.new { border-color: var(--ok); }

/* ---------- footer ---------- */
.footer { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 0; position: sticky; bottom: 0; z-index: 15; padding-block: 9px; padding-bottom: max(9px, env(safe-area-inset-bottom, 0px)); background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -6px 14px -10px rgba(0,0,0,0.25); }
.footer > * + * { border-left: 1px solid var(--line); }
/* prescription summary: one row per section, in that section's colour */
.rx-sum { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; padding-right: 18px; }
.sum-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin-right: 4px; }
.sum-pill { --c: var(--none); --cbg: var(--none-bg); display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink); background: color-mix(in srgb, var(--cbg) 55%, var(--panel)); border-radius: 14px; padding: 4px 11px; white-space: nowrap; }
.sum-pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.sum-pill b { font-weight: 700; font-variant-numeric: tabular-nums; }
.sum-pill.zero { background: transparent; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); }
.sum-pill.zero i { opacity: 0.4; }
.sum-pill.p-dx { --c: var(--dx); --cbg: var(--dx-bg); }
.sum-pill.p-rx { --c: var(--rx); --cbg: var(--rx-bg); }
.sum-pill.p-inv { --c: var(--inv); --cbg: var(--inv-bg); }
.sum-pill.p-adv { --c: var(--adv); --cbg: var(--adv-bg); }
.sum-alert { display: inline-flex; gap: 5px; align-items: center; color: var(--crit); background: var(--crit-bg); font-size: 13px; font-weight: 600; border-radius: 14px; padding: 4px 11px; }
.sum-alert svg { width: 14px; height: 14px; }
.fu { display: grid; gap: 6px; padding-inline: 18px; font-size: 13.5px; }
.fu input { width: 16px; height: 16px; accent-color: var(--brand); margin: 0 4px 0 0; }
.fu label { display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
.fu-chips { display: flex; align-items: center; gap: 5px; }
.fu-chip { border: 0; background: var(--chip); color: var(--ink-2); border-radius: 2px; padding: 2px 9px; font-size: 12.5px; cursor: pointer; }
.fu-chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.fu-date { font-size: 12px; color: var(--brand-2); font-weight: 600; margin-left: 4px; white-space: nowrap; }
.finish-wrap { display: flex; align-items: center; gap: 14px; padding-left: 18px; }
.sign { display: grid; text-align: right; color: var(--ink-3); font-size: 12.5px; line-height: 1.4; white-space: nowrap; }
.finish { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 3px; padding: 11px 18px; font-weight: 700; font-size: 14px; letter-spacing: 0.02em; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 9px; white-space: nowrap; }
.finish kbd { font-family: var(--f-mono); font-size: 10px; opacity: 0.75; border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; font-weight: 400; text-transform: none; }
.finish:hover { background: var(--brand-2); }
.finish.danger { background: var(--crit); }

/* menu + toast */
.menu { position: fixed; z-index: 50; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.16); padding: 4px; display: grid; min-width: 170px; }
.menu .mh { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); padding: 4px 8px; }
.menu button { border: 0; background: transparent; text-align: left; padding: 6px 8px; border-radius: 3px; cursor: pointer; display: flex; gap: 8px; align-items: center; font-size: 13px; }
.menu button:hover, .menu button:focus-visible { background: var(--panel-2); }
.menu button i { width: 9px; height: 9px; border-radius: 50%; }
.menu button[aria-current="true"] { font-weight: 700; }
.search-wrap { position: relative; }
.search-list { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 60; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 10px 24px rgba(0,0,0,0.2); padding: 4px; display: grid; min-width: 240px; }
.search-list button { border: 0; background: transparent; text-align: left; padding: 6px 8px; border-radius: 3px; cursor: pointer; display: grid; font-size: 13px; }
.search-list button span { font-size: 11.5px; color: var(--ink-3); }
.search-list button:hover, .search-list button:focus-visible { background: var(--panel-2); }
.search-list button[aria-current="true"] b::after { content: " · open"; font-weight: 400; color: var(--brand-2); font-size: 11.5px; }
.search-list .none { padding: 6px 8px; font-size: 12.5px; color: var(--ink-3); }
.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #222; color: #fff; padding: 10px 16px; border-radius: 4px; font-size: 13.5px; max-width: min(560px, calc(100vw - 32px)); z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }

@media (max-width: 1280px) {
  .band { grid-template-columns: auto minmax(220px, 1fr) minmax(0, 2fr); row-gap: 8px; }
  .band > .conds-cell { grid-column: 2; border-left: 0; border-radius: 4px 0 0 4px; }
  .band > .meds-cell { grid-column: 3; }
  .photo { grid-row: span 2; }
}
@media (max-width: 1180px) {
  html, body { height: auto; }
  .app { height: auto; }
  .work { grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); }
  .records { grid-column: 1 / -1; max-height: 640px; }
  .composer { min-height: 280px; }
  .footer { grid-template-columns: minmax(0, 1fr) auto; row-gap: 8px; }
  .footer .fu { grid-column: 1; grid-row: 2; padding-left: 0; border-left: 0; }
  .footer .finish-wrap { grid-row: 1 / 3; grid-column: 2; }
}
@media (max-width: 860px) {
  .appbar-link, .appbar .vsep, .appbar-user { display: none; }
  .search { width: 160px; }
  .queue { margin-left: 0; width: 100%; gap: 16px; font-size: 14px; }
  .band { grid-template-columns: 76px minmax(0, 1fr); column-gap: 10px; max-height: 48vh; overflow: auto; }
  .footer { grid-template-columns: minmax(0, 1fr); }
  .footer .fu, .footer .finish-wrap { grid-column: 1; grid-row: auto; padding-left: 0; border-left: 0; }
  .finish-wrap { justify-content: space-between; }
  .sign { text-align: left; }
  .photo { grid-column: 1; grid-row: 1; width: 76px; height: 76px; align-self: start; margin: 0; }
  .band > .cell, .band > .conds-cell, .band > .meds-cell { grid-column: 1 / -1; border-left: 0; border-radius: 4px; }
  .band > .who { grid-column: 2; grid-row: 1; padding: 8px 12px; }
  .who h1 { font-size: 17px; }
  .who p { font-size: 13px; line-height: 1.55; }
  .vitals { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .work { grid-template-columns: minmax(0, 1fr); }
  .record { grid-template-columns: minmax(0, 1fr); }
  .finish { padding: 12px 18px; font-size: 15px; }
  .sign span { display: none; }
}
/* per-word suggestions, floating under the word being typed */
.ac { position: absolute; top: calc(100% + 8px); z-index: 70; min-width: 280px; max-width: min(580px, calc(100vw - 16px)); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 14px 32px rgba(0,0,0,0.2); padding: 4px; display: grid; }
.ac::before { content: ""; position: absolute; top: -6px; left: 18px; width: 10px; height: 10px; background: var(--panel); border-left: 1px solid var(--line); border-top: 1px solid var(--line); transform: rotate(45deg); }
.ac-opt { --c: var(--none); --cbg: var(--none-bg); display: grid; grid-template-columns: 88px minmax(max-content, 1fr) auto; gap: 10px; align-items: center; border: 0; background: transparent; text-align: left; padding: 7px 9px; border-radius: 5px; cursor: pointer; font-size: 14px; color: var(--ink); }
.ac-opt[aria-selected="true"] { background: color-mix(in srgb, var(--cbg) 70%, var(--panel)); }
.ac-opt .cl { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--c); }
.ac-opt .cl i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.ac-opt .ex { font-size: 12px; color: var(--ink-3); white-space: nowrap; max-width: 270px; overflow: hidden; text-overflow: ellipsis; }
.ac-opt mark { background: transparent; color: inherit; font-weight: 700; }
.ac-opt.c-sym { --c: var(--sym); --cbg: var(--sym-bg); } .ac-opt.c-dx { --c: var(--dx); --cbg: var(--dx-bg); } .ac-opt.c-rx { --c: var(--rx); --cbg: var(--rx-bg); } .ac-opt.c-inv { --c: var(--inv); --cbg: var(--inv-bg); } .ac-opt.c-adv { --c: var(--adv); --cbg: var(--adv-bg); } .ac-opt.c-tpl { --c: var(--brand-2); --cbg: var(--inv-bg); }
.ac-foot { font-size: 11px; color: var(--ink-3); padding: 5px 9px 3px; border-top: 1px solid var(--line-2); margin-top: 2px; }
.ac-foot kbd { font-family: var(--f-mono); font-size: 10px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.ac { position: fixed; top: 0; }
.ac.above::before { top: auto; bottom: -6px; transform: rotate(225deg); }
.caret-probe { position: absolute; inset: 0; visibility: hidden; pointer-events: none; overflow: hidden; }

/* Focus glow: a soft, slowly turning ring in light tints of the five section colours, shown while the cursor is in the box. */
@property --glow-angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
.glow-host { position: relative; isolation: isolate; }
.glow-host::before, .glow-host::after {
  content: ""; position: absolute; pointer-events: none; border-radius: inherit; opacity: 0; transition: opacity .45s ease;
  --t: 58%;
  background: conic-gradient(from var(--glow-angle), color-mix(in srgb, var(--sym) var(--t), #fff), color-mix(in srgb, var(--dx) var(--t), #fff), color-mix(in srgb, var(--rx) var(--t), #fff), color-mix(in srgb, var(--inv) var(--t), #fff), color-mix(in srgb, var(--adv) var(--t), #fff), color-mix(in srgb, var(--sym) var(--t), #fff));
  animation: glow-spin 6s linear infinite;
}
.glow-host::before { inset: -1.5px; padding: 1.5px; z-index: 3; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.glow-host::after { inset: -2px; z-index: -1; filter: blur(7px); }
.glow-host:focus-within > .composer, .glow-host:focus-within > .qbar { border-color: var(--line); box-shadow: none; }
.glow-host:focus-within::before { opacity: 0.9; }
.glow-host:focus-within::after { opacity: 0.35; }
@keyframes glow-spin { to { --glow-angle: 360deg; } }
/* ---------- the note pane can be dragged wider or narrower; Today's record takes up the difference ---------- */
.card.compose { position: relative; }
.col-resize { position: absolute; top: 0; bottom: 0; right: -10px; width: 10px; cursor: col-resize; z-index: 5; touch-action: none; display: grid; place-items: center; }
.col-resize::before { content: ""; width: 2px; height: 100%; border-radius: 1px; background: transparent; transition: background 0.15s; }
.col-resize::after { content: ""; position: absolute; width: 6px; height: 36px; border-radius: 3px; background: var(--line); border: 1px solid var(--panel); transition: background 0.15s; }

const DOCTOR = "Dr. Pradeep Dewan";

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cap1 = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fmtD = (s, withYear = true) => { const d = parseD(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}${withYear ? " " + d.getFullYear() : ""}`; };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const daysAgo = s => Math.round((today() - parseD(s)) / 86400000);
const fmtShort = s => { const d = parseD(s); return d.getFullYear() === today().getFullYear() ? fmtD(s, false) : fmtD(s); };

/* ======================= Classifier ======================= */
function bestTerm(t) {
  let best = null;
  for (const term of TERMS) {
    const m = term.re.exec(t);
    if (!m) continue;
    const pos = m.index + m[0].length - m[1].length;
    if (!best || pos < best.pos || (pos === best.pos && term.term.length > best.term.term.length)) best = { term, pos };
  }
  return best;
}

function classify(raw, forced, prev) {
  const key = raw.toLowerCase().replace(/\s+/g, " ").trim();
  let t = key.replace(/x[\s-]ray/g, "xray");
  const f = { key, raw, cat: null, neg: false, prov: false, sub: null, match: null, learned: false, inherited: false };
  if (PROV_RE.test(t)) { f.prov = true; t = t.replace(PROV_RE, ""); }
  if (NEG_RE.test(t)) { f.neg = true; t = t.replace(NEG_RE, ""); }
  f.body = t;
  const form = FORM_RE.exec(t);
  const best = bestTerm(t);
  f.match = best ? best.term : null;
  f.form = form ? form[1].toLowerCase() : null;

  if (state.overrides[key]) { f.cat = state.overrides[key]; f.learned = true; }
  else if (f.prov) f.cat = "dx";
  else if (forced) { f.cat = forced === "exam" ? "sym" : forced; if (forced === "exam") f.sub = "exam"; }
  else if (form) f.cat = "rx";
  else if (best) { f.cat = best.term.cat; f.sub = best.term.sub || null; }
  else if (prev && prev.cat && prev.cat !== "none") { f.cat = prev.cat; f.sub = prev.sub; f.inherited = true; }
  else f.cat = "none";
  return f;
}

function analyse(text) {
  const frags = [];
  let offset = 0;
  for (const line of text.split("\n")) {
    const lineStart = offset; offset += line.length + 1;
    let forced = null, bodyStart = 0;
    const m = LINE_PREFIX.exec(line);
    if (m) {
      forced = PREFIX_CAT[(m[1] || m[2]).toLowerCase()] || null;
      bodyStart = m[0].length;
      frags.push({ cat: "pfx", start: lineStart, end: lineStart + m[0].trimEnd().length });
    }
    const body = line.slice(bodyStart);
    const sep = /,|;|\.(?=\s|$)|\s+and\s+|\s+&\s+/gi;
    let last = 0, prev = null, mm;
    const pieces = [];
    while ((mm = sep.exec(body))) { pieces.push([last, mm.index]); last = mm.index + mm[0].length; }
    pieces.push([last, body.length]);
    for (const [a, b] of pieces) {
      const seg = body.slice(a, b);
      const lead = seg.length - seg.trimStart().length;
      const s = seg.trim();
      if (s.length < 2) continue;
      const f = classify(s, forced, prev);
      f.start = lineStart + bodyStart + a + lead;
      f.end = f.start + s.length;
      frags.push(f);
      prev = f;
    }
  }
  return frags;
}

/* ---------- turning fragments into record items ---------- */
function prettify(f) {
  let t = f.body;
  let dur = null;
  if (f.cat === "sym") {
    const d = DUR_RE.exec(t);
    if (d) { dur = fmtDur(d[1], d[2]); t = (t.slice(0, d.index) + t.slice(d.index + d[0].length)).replace(/\s{2,}/g, " ").trim(); }
  }
  if (f.match && f.match.canon && f.match.term.length <= 6 && f.cat === f.match.cat) {
    t = t.replace(f.match.re, (all, g) => all.replace(g, f.match.canon));
  }
  t = t.replace(/\bxray\b/g, "X-ray");
  return { text: cap1(t.trim()), dur };
}
function fmtDur(n, u) {
  n = +n; u = u.toLowerCase();
  const unit = /^d/.test(u) ? "day" : /^w/.test(u) ? "week" : /^(mo|m$|month)/.test(u) ? "month" : /^h/.test(u) ? "hour" : "day";
  return `${n} ${unit}${n === 1 ? "" : "s"}`;
}

function parseMed(raw, f) {
  let t = raw.toLowerCase().replace(/\s+/g, " ").trim();
  const med = { raw, key: f.key, learned: f.learned, form: null, name: null, drug: null, str: null, unit: null, dose: null, freq: null, dur: null, instr: [], defStr: false, unknown: false };
  const fm = FORM_RE.exec(t);
  if (fm) { med.form = FORM_NAME[fm[1].toLowerCase()] || cap1(fm[1]); t = t.slice(fm[0].length); }
  const best = bestTerm(t);
  if (best && best.term.cat === "rx") {
    med.drug = best.term.drug; med.name = med.drug.name; med.term = best.term.term;
    t = t.slice(0, best.pos) + " " + t.slice(best.pos + best.term.term.length);
  } else {
    const w = /^([a-z][a-z0-9\-\/]*)/.exec(t);
    med.name = w ? cap1(w[1]) : "Unnamed medicine"; med.unknown = true;
    if (w) t = t.slice(w[0].length);
  }
  for (const [re, val] of FREQS) {
    const m = re.exec(t);
    if (m) { med.freq = val || [m[1], m[2], m[3], m[4]].filter(Boolean).join("-"); t = t.replace(m[0], " "); break; }
  }
  const d = /(?:\bx\s*|\bfor\s+|×\s*)(\d+)\s*(d|days?|w|wks?|weeks?|mo|months?|m)\b|\b(\d+)\s*(days?|weeks?|wks?|months?)\b/i.exec(t);
  if (d) { med.dur = fmtDur(d[1] || d[3], d[2] || d[4]); t = t.replace(d[0], " "); }
  for (const [re, val] of INSTRS) { const m = re.exec(t); if (m) { med.instr.push(val); t = t.replace(m[0], " "); } }
  const s = /(\d+(?:\.\d+)?(?:\/\d+(?:\.\d+)?)?)\s*(mg|mcg|µg|gm|g|ml|iu|units?|puffs?|drops?|sachets?|tabs?)?\b/i.exec(t);
  if (s) {
    const unit = (s[2] || "").toLowerCase();
    if (/^(puff|drop|tab)/.test(unit)) { med.dose = `${s[1]} ${unit}`; t = t.replace(s[0], " "); }
    else { med.str = s[1]; med.unit = unit === "gm" ? "g" : unit || (med.drug ? med.drug.unit : "mg"); }
  }
  if (!med.str && med.drug) { med.str = med.drug.str; med.unit = med.drug.unit; med.defStr = true; }
  if (!med.form) med.form = med.drug && med.drug.form ? med.drug.form : med.drug && med.drug.unit === "mcg" ? "Inhaler" : med.unit === "ml" ? "Syrup" : "Tab";
  if (med.drug && /salbutamol|budesonide|formoterol|tiotropium/i.test(med.name) && med.form === "Tab") med.form = "Inhaler";
  return med;
}

function medFlags(med, p) {
  const flags = [];
  if (med.drug && med.drug.cls) {
    const a = p.allergies.find(x => x.cls === med.drug.cls);
    if (a) flags.push({ lvl: "crit", text: `Allergic to ${a.name} (${a.reaction}). ${med.name} is in this group.` });
  }
  if (med.drug) {
    const cur = p.meds.find(m => m.drug === med.drug.key || med.name.toLowerCase().startsWith(m.drug));
    if (cur) {
      if (cur.str === med.str) flags.push({ lvl: "info", text: `Continues current ${cur.label}, ${cur.freq}.` });
      else flags.push({ lvl: "warn", text: `Dose change: currently on ${cur.label}, ${cur.freq}.` });
    }
  }
  if (med.drug && med.drug.oos) {
    const alt = TERMS.find(t => t.term === med.drug.alt);
    flags.push({ lvl: "warn", text: `Out of stock in the hospital pharmacy. ${alt.drug.name} (${alt.drug.generic}) is in stock.`, swap: alt.term, swapName: alt.drug.name });
  }
  if (med.unknown) flags.push({ lvl: "warn", text: "Not in the hospital formulary. Check the spelling." });
  return flags;
}

function testLast(term, p) {
  if (!term) return null;
  if (term.labs) {
    const hits = p.labs.filter(l => term.labs.includes(l.name));
    if (!hits.length) return null;
    hits.sort((a, b) => b.series.at(-1)[0].localeCompare(a.series.at(-1)[0]));
    const l = hits[0], [date, val] = l.series.at(-1);
    return { date, text: `${l.name} ${val} ${l.unit}` };
  }
  if (term.scan) {
    const s = p.scans.filter(x => x.key === term.scan).sort((a, b) => b.date.localeCompare(a.date))[0];
    if (s) return { date: s.date, text: s.imp };
  }
  return null;
}

function followUp(text) {
  const m = /(review|follow[- ]?up|f\/u|revisit|come back)\b.*?(?:after|in)?\s*(\d+)\s*(d|days?|w|wks?|weeks?|mo|months?|m)\b/i.exec(text);
  if (!m) return null;
  const n = +m[2], u = m[3].toLowerCase(), d = today();
  if (/^w/.test(u)) d.setDate(d.getDate() + n * 7);
  else if (/^(mo|m$|month)/.test(u)) d.setMonth(d.getMonth() + n);
  else d.setDate(d.getDate() + n);
  return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
}

function buildItems(frags, p) {
  const items = { sym: [], dx: [], rx: [], inv: [], adv: [], none: [] };
  let lastMed = null;
  for (const f of frags) {
    if (f.cat === "pfx") continue;
    if (f.cat === "rx") {
      const hasDrug = f.form || (f.match && f.match.cat === "rx");
      if (!hasDrug && lastMed) { lastMed.raw += " " + f.raw; Object.assign(lastMed, parseMed(lastMed.raw, { key: lastMed.key, learned: lastMed.learned })); lastMed.end = f.end; continue; }
      lastMed = parseMed(f.raw, f); lastMed.start = f.start; lastMed.end = f.end; items.rx.push(lastMed); continue;
    }
    lastMed = null;
    const pr = prettify(f);
    const it = { key: f.key, start: f.start, end: f.end, text: pr.text, dur: pr.dur, neg: f.neg, prov: f.prov, sub: f.sub, learned: f.learned, inherited: f.inherited };
    if (f.cat === "dx") {
      const low = (f.body + " " + pr.text).toLowerCase();
      const known = p.conditions.find(c => c.match.some(m => new RegExp("\\b" + escRe(m)).test(low)));
      if (known) it.known = known;
    }
    if (f.cat === "inv") {
      const term = f.match && f.match.cat === "inv" ? f.match : null;
      if (term && term.canon && f.body.trim() === term.term) it.text = term.canon;
      it.last = testLast(term, p);
    }
    if (f.cat === "adv") it.date = followUp(f.body);
    items[f.cat].push(it);
  }
  items.rx.forEach(m => m.flags = medFlags(m, p));
  return items;
}

// Medicine suggestions: brands whose generic matches what's typed ("para" finds Dolo 650), and an in-stock
// alternative right under any brand the pharmacy is out of. After "tab", "syp" and the like, only medicines.
function rxExtras(q, list, rxOnly) {
  if (rxOnly) list = list.filter(t => t.cat === "rx");
  const have = new Set(list.map(t => t.term));
  const gens = q.length >= 3 ? TERMS.filter(t => t.drug && t.drug.brand && !have.has(t.term) && t.drug.generic.toLowerCase().startsWith(q)) : [];
  const at = list.findIndex(t => t.drug && !t.drug.brand && t.drug.name.toLowerCase().startsWith(q));
  const out = [];
  for (const t of at < 0 ? [...list, ...gens] : [...list.slice(0, at + 1), ...gens, ...list.slice(at + 1)]) {
    out.push(t);
    if (t.drug && t.drug.oos && !out.some(x => x.altFor && x.term === t.drug.alt)) out.push({ ...TERMS.find(x => x.term === t.drug.alt), altFor: t.drug.name });
  }
  const alts = new Set(out.filter(x => x.altFor).map(x => x.term));
  return out.filter(x => x.altFor || !alts.has(x.term));
}

const ordinal = n => n + (n % 10 === 1 && n !== 11 ? "st" : n % 10 === 2 && n !== 12 ? "nd" : n % 10 === 3 && n !== 13 ? "rd" : "th");
const longDate = d => `${ordinal(d.getDate())} ${MONTHS[d.getMonth()]}, ${d.getFullYear()}`;
const labDate = s => { const d = parseD(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${d.getFullYear()}`; };
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

// Right side of the doctor bar: token with attendance, then the waiting queue.
function renderQueue() {
  const next = PATIENTS[((state.edit ? state.edit.returnTo : state.pi) + 1) % PATIENTS.length];
  const cur = PATIENTS[state.edit ? state.edit.returnTo : state.pi];
  const tick = `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.3 5 8.6l4.5-5"/></svg>`;
  const att = state.edit ? "" : cur.present
    ? `<span class="present-pill" title="Marked present at ${esc(cur.present)}">${tick}Present · ${esc(cur.present)}</span>`
    : `<button class="mark-present" type="button" id="att-present" title="Mark the patient on token ${QUEUE.token} as present">${tick}Mark present</button>`;
  $("#queue").innerHTML = `
    <span class="qgroup"><span>Token: <b>${QUEUE.token}</b></span>${att}</span>
    <span class="qsep" aria-hidden="true"></span>
    <span class="qgroup"><span>In Waiting: <b>${QUEUE.waiting}</b></span><span class="next">Next Patient: <b>${esc(next.name)}, ${next.sex.charAt(0)}, ${next.age}</b></span></span>`;
  const btn = $("#att-present");
  if (btn) btn.onclick = () => { cur.present = nowTime(); renderQueue(); };
}

/* ---------- vitals: sparkline in the tile, fuller chart on click ---------- */
const vitalSeries = v => [...(v.hist || []), [isoDay(today()), v.v]].map(([d, val]) => [d, String(val).split("/").map(Number)]);
const vitalColor = v => v.flag === "high" || v.flag === "low" ? "var(--crit)" : v.flag === "border" ? "var(--warn)" : "var(--ink-3)";

function vitalSpark(v) {
  if (!v.hist || !v.hist.length) return `<span class="spark none"></span>`;
  // BP draws systolic (solid) and diastolic (dashed) on one shared scale.
  const s = vitalSeries(v), lines = s[0][1].length;
  const all = s.flatMap(x => x[1]);
  const min = Math.min(...all), max = Math.max(...all), span = max - min || 1;
  const h = lines > 1 ? 24 : 16, col = vitalColor(v);
  const line = k => {
    const pts = s.map((x, i) => [2 + (i * 96) / (s.length - 1), h - 3 - ((x[1][k] - min) / span) * (h - 6)]);
    return `<polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="${col}" stroke-width="1.4" ${k ? 'stroke-dasharray="3 2" opacity="0.75"' : ""} vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
  };
  return `<svg class="spark" viewBox="0 0 100 ${h}" style="height:${h}px" preserveAspectRatio="none" aria-hidden="true">${line(0)}${lines > 1 ? line(1) : ""}</svg>`;
}

function vitalChart(v) {
  const s = vitalSeries(v), W = 284, H = 128, L = 24, R = 24, T = 16, B = 22;
  const all = s.flatMap(x => x[1]).concat(v.ref || []);
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.12 || 2; lo -= pad; hi += pad;
  const x = i => L + (i * (W - L - R)) / (s.length - 1);
  const y = val => T + (1 - (val - lo) / (hi - lo)) * (H - T - B);
  const col = v.flag === "high" || v.flag === "low" ? "var(--crit)" : v.flag === "border" ? "var(--warn)" : "var(--brand)";
  const band = v.ref ? `<rect x="${L - 8}" y="${y(v.ref[1])}" width="${W - L - R + 16}" height="${y(v.ref[0]) - y(v.ref[1])}" fill="var(--inv-bg)" opacity="0.7"/>` : "";
  const series = [0, 1].filter(k => s[0][1][k] != null).map(k => {
    const below = k === 1;
    return `<polyline points="${s.map((p, i) => `${x(i)},${y(p[1][k])}`).join(" ")}" fill="none" stroke="${col}" stroke-width="1.8" ${below ? 'stroke-dasharray="4 3"' : ""} stroke-linejoin="round"/>` +
      s.map((p, i) => `<circle cx="${x(i)}" cy="${y(p[1][k])}" r="3" fill="var(--panel)" stroke="${col}" stroke-width="1.6"/><text x="${x(i)}" y="${y(p[1][k]) + (below ? 14 : -7)}" text-anchor="middle" font-size="10" font-family="IBM Plex Mono, monospace" fill="var(--ink-2)">${p[1][k]}</text>`).join("");
  }).join("");
  const xl = s.map((p, i) => { const d = parseD(p[0]); return `<text x="${x(i)}" y="${H - 5}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${i === s.length - 1 ? "Today" : `${d.getDate()} ${MONTHS[d.getMonth()]}`}</text>`; }).join("");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(v.k)} over the last ${s.length} readings">${band}${series}${xl}</svg>`;

// Conditions get three rows in the band; the rest fold into "+N more", which opens the full list.
function fitConds() {
  const box = $("#patient .conds-cell .conds"); if (!box) return;
  const chips = [...box.querySelectorAll(".cond:not(.allergy):not(.nka)")];
  const btn = box.querySelector("[data-expand=conds]");
  chips.forEach(c => c.hidden = false); btn.hidden = true;
  const first = box.firstElementChild, limit = first.offsetTop + (first.offsetHeight + 8) * 3 - 4;
  const fits = el => el.offsetTop < limit;
  if (chips.every(fits)) return;
  btn.hidden = false;
  for (let i = chips.length - 1; i >= 0; i--) {
    btn.textContent = `+${chips.length - i} more`;
    chips[i].hidden = true;
    if (fits(btn) && chips.every(c => c.hidden || fits(c))) break;
  }
}

function sparkline(series, flag) {
  if (series.length < 2) return `<svg width="96" height="22" aria-hidden="true"></svg>`;
  const w = 96, h = 22, vals = series.map(s => s[1]);
  const min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;
  const pts = vals.map((v, i) => [3 + (i * (w - 6)) / (vals.length - 1), h - 4 - ((v - min) / span) * (h - 8)]);
  const col = flag === "high" || flag === "low" ? "var(--crit)" : flag === "border" ? "var(--warn)" : "var(--ink-3)";
  const last = pts.at(-1);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${col}"/></svg>`;
}

function renderRecords(p) {

  }).join("");

      const [date, val] = l.series.at(-1);

        <div class="lab-prev">${prev != null ? `Prev: ${prev}` : "First result"}</div>

  } else if (state.tab === "scans") {
    html = p.scans.length ? p.scans.map((s, si) => `<div class="rec-card scan"><div class="scan-body"><h4>${esc(s.name)}</h4><p class="imp">${esc(s.imp)}</p><p>${esc(s.by)}</p></div><div class="scan-side"><span class="date">${labDate(s.date)}</span><div class="lab-acts"><button type="button" data-report="scan" data-i="${si}" title="Open the ${esc(s.name)} report">See report</button></div></div></div>`).join("") : emptyState(p, "scans");
  } else if (state.tab === "adm") {
